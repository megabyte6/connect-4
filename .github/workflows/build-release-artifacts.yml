name: Build release artifacts

on:
  push:
    tags:
      - v*
  workflow_dispatch:

jobs:
  build-release-artifacts:
    name: ${{ matrix.os }}-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: amd64
            runner: ubuntu-24.04
            gradle: ./gradlew
          - os: linux
            arch: arm64
            runner: ubuntu-24.04-arm
            gradle: ./gradlew
          - os: windows
            arch: amd64
            runner: windows-latest
            gradle: .\\gradlew.bat
          - os: macos
            arch: amd64
            runner: macos-26-intel
            gradle: ./gradlew
          - os: macos
            arch: arm64
            runner: macos-26
            gradle: ./gradlew

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Ensure Gradle wrapper is executable
        if: runner.os != 'Windows'
        run: chmod +x ./gradlew

      - name: Build portable
        run: ${{ matrix.gradle }} jlink

      - name: Upload portable
        uses: actions/upload-artifact@v7
        with:
          name: connect-4_${{ matrix.os }}-${{ matrix.arch }}_portable.zip
          path: build/image
          if-no-files-found: error

      - name: Build package
        run: ${{ matrix.gradle }} jpackage

      - name: Upload package (msi)
        if: matrix.os == 'windows'
        uses: actions/upload-artifact@v7
        with:
          name: connect-4_${{ matrix.os }}-${{ matrix.arch }}.msi
          path: build/jpackage/*.msi
          if-no-files-found: error
          archive: false

      - name: Upload package (exe)
        if: matrix.os == 'windows'
        uses: actions/upload-artifact@v7
        with:
          name: connect-4_${{ matrix.os }}-${{ matrix.arch }}.exe
          path: build/jpackage/*.exe
          if-no-files-found: error
          archive: false

      - name: Upload package (deb)
        if: matrix.os == 'linux'
        uses: actions/upload-artifact@v7
        with:
          name: connect-4_${{ matrix.os }}-${{ matrix.arch }}.deb
          path: build/jpackage/*.deb
          if-no-files-found: error
          archive: false

      - name: Upload package (rpm)
        if: matrix.os == 'linux'
        uses: actions/upload-artifact@v7
        with:
          name: connect-4_${{ matrix.os }}-${{ matrix.arch }}.rpm
          path: build/jpackage/*.rpm
          if-no-files-found: error
          archive: false

      - name: Upload package (dmg)
        if: matrix.os == 'macos'
        uses: actions/upload-artifact@v7
        with:
          name: connect-4_${{ matrix.os }}-${{ matrix.arch }}.dmg
          path: build/jpackage/*.dmg
          if-no-files-found: error
          archive: false

      - name: Upload package (pkg)
        if: matrix.os == 'macos'
        uses: actions/upload-artifact@v7
        with:
          name: connect-4_${{ matrix.os }}-${{ matrix.arch }}.pkg
          path: build/jpackage/*.pkg
          if-no-files-found: error
          archive: false
