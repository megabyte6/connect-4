name: Build release artifacts

on:
  push:
    tags:
      - v*
  workflow_dispatch:

jobs:
  build-release-artifacts:
    name: ${{ matrix.os }}-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: amd64
            runner: ubuntu-24.04
            gradle: ./gradlew
          - os: linux
            arch: arm64
            runner: ubuntu-24.04-arm
            gradle: ./gradlew
          - os: windows
            arch: amd64
            runner: windows-latest
            gradle: .\\gradlew.bat
          - os: macos
            arch: amd64
            runner: macos-26-intel
            gradle: ./gradlew
          - os: macos
            arch: arm64
            runner: macos-26
            gradle: ./gradlew

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Ensure Gradle wrapper is executable
        if: runner.os != 'Windows'
        run: chmod +x ./gradlew

      - name: Build jlinkZip
        run: ${{ matrix.gradle }} jlinkZip

      - name: Upload jlinkZip
        uses: actions/upload-artifact@v4
        with:
          name: connect4-${{ matrix.os }}-${{ matrix.arch }}-portable
          path: build/connect4.zip
          if-no-files-found: error

      - name: Build jpackage
        run: ${{ matrix.gradle }} jpackage

      - name: Upload jpackage
        uses: actions/upload-artifact@v4
        with:
          name: connect4-${{ matrix.os }}-${{ matrix.arch }}
          path: build/jpackage/**
          if-no-files-found: error
